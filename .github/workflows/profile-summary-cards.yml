name: Update Profile Summary Cards

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate current cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Calix-L
          UTC_OFFSET: 8
          AUTO_PUSH: false

      - name: Publish transparent cards
        run: |
          install -m 0644 profile-summary-card-output/transparent/0-profile-details.svg assets/profile-details.svg
          install -m 0644 profile-summary-card-output/transparent/2-most-commit-language.svg assets/most-commit-language.svg
          install -m 0644 profile-summary-card-output/transparent/3-stats.svg assets/stats.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-details.svg assets/most-commit-language.svg assets/stats.svg
          if git diff --cached --quiet; then
            echo "Profile cards are already current."
          else
            git commit -m "chore: refresh profile summary cards"
            git push
          fi
